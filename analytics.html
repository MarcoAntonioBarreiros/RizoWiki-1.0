<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizoWiki · Fatores</title>
<link rel="stylesheet" href="css/all.min.css">
<style>
:root { --bg:#050816; --panel:rgba(15,23,42,.62); --panel-b:rgba(255,255,255,.08); --text:#cbd5e1; --muted:#94a3b8; --faint:#334155;
  --strong:#fff; --grid:rgba(255,255,255,.07); --chip:rgba(255,255,255,.05); --chip-b:rgba(255,255,255,.1); --hatch:rgba(148,163,184,.13);
  --pop:#0f172a; --shadow:0 20px 50px rgba(0,0,0,.55); --accent:#0ea5e9; }
html.light-mode { --bg:#f1f5f9; --panel:#ffffff; --panel-b:#e2e8f0; --text:#334155; --muted:#64748b; --faint:#cbd5e1; --strong:#0f172a;
  --grid:rgba(15,23,42,.08); --chip:#f8fafc; --chip-b:#e2e8f0; --hatch:rgba(100,116,139,.14); --pop:#ffffff; --shadow:0 18px 40px rgba(15,23,42,.18); }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; transition:background .3s,color .3s; overflow-x:hidden; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
.wrap { max-width:1500px; margin:0 auto; padding:22px clamp(12px,3vw,40px) 60px; }
.panel { background:var(--panel); border:1px solid var(--panel-b); border-radius:18px; padding:20px 22px; backdrop-filter:blur(12px); }
.display { font-family:'Space Grotesk', Inter, sans-serif; }
.eyebrow { font-size:11px; letter-spacing:.18em; text-transform:uppercase; font-weight:800; color:var(--accent); margin:0 0 6px; }
h1,h2,h3 { color:var(--strong); margin:0; font-family:'Space Grotesk', Inter, sans-serif; letter-spacing:-.02em; }
h1 { font-size:clamp(24px,3vw,36px); line-height:1.1; }
h2 { font-size:21px; }
h3 { font-size:16px; }
.lead { color:var(--muted); font-size:15px; line-height:1.55; margin:8px 0 0; max-width:900px; }
.selo { display:inline-flex; gap:8px; align-items:center; font-size:12px; font-weight:700; color:#22c55e; background:rgba(34,197,94,.1);
  border:1px solid rgba(34,197,94,.35); padding:5px 11px; border-radius:999px; }
html.embutido body { background:transparent; }
.chip.ok { color:#22c55e; } .chip.pend { color:#eab308; }
.sankey-panel { margin-top:18px; }
.sk-info { --c:#22c55e; display:flex; gap:14px; align-items:flex-start; margin:14px 0 6px; padding:13px 16px; border-radius:14px; background:var(--chip);
  border-left:4px solid var(--c); min-height:74px; }
.sk-info > i { color:var(--c); font-size:20px; margin-top:2px; }
.sk-info b { display:block; color:var(--c); font-size:13px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
.sk-info span { font-size:13.5px; line-height:1.5; color:var(--text); }
#sankey svg { display:block; overflow:visible; }
.previa { display:inline-flex; gap:8px; align-items:center; font-size:12px; font-weight:700; color:#eab308; background:rgba(234,179,8,.1);
  border:1px solid rgba(234,179,8,.35); padding:5px 11px; border-radius:999px; }

/* navegação por fator */
.nav { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; margin:16px 0 6px; scrollbar-width:thin; }
.nav button { display:inline-flex; align-items:center; gap:8px; white-space:nowrap; min-height:48px; padding:10px 16px; border-radius:12px;
  background:var(--chip); border:1px solid var(--chip-b); font-weight:700; font-size:14px; color:var(--text); transition:all .2s; }
.nav button i { color:var(--muted); }
.nav button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.nav button.on i { color:#fff; }
.nav button.soacervo { opacity:.55; cursor:default; }

/* MATRIZ */
.matriz-rolagem { overflow-x:auto; margin-top:14px; padding-bottom:6px; }
.matriz { display:grid; grid-template-columns:168px repeat(9, minmax(112px,1fr)); gap:6px; min-width:1220px; }
.m-cab { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; padding:6px 4px 10px; border-radius:12px;
  background:none; border:0; color:var(--strong); font-weight:700; font-size:12.5px; text-align:center; line-height:1.2; min-height:72px; }
.m-cab i { font-size:17px; color:var(--accent); }
.m-cab:hover { background:var(--chip); }
.m-cab.soacervo { color:var(--muted); cursor:default; }
.m-cab.soacervo i { color:var(--muted); }
.m-org { display:flex; align-items:center; gap:10px; padding:0 8px; font-weight:700; color:var(--strong); font-size:14.5px; }
.m-org i { width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 10px var(--c); background:var(--c); }
.m-org small { display:block; font-weight:500; color:var(--muted); font-size:11px; }
.tile { position:relative; min-height:96px; border-radius:14px; display:grid; grid-template-columns:52px 1fr; grid-template-rows:auto auto; align-items:center; column-gap:2px; padding:12px 8px 8px 2px; text-align:left;
  background:linear-gradient(145deg, var(--bgc), transparent 120%); border:1px solid var(--bdc); transition:transform .15s, box-shadow .2s; }
.tile:hover, .tile.sel { transform:translateY(-2px); box-shadow:0 10px 26px -10px var(--c); border-color:var(--c); }
.tile svg { flex:none; overflow:visible; }
.t-txt { display:flex; flex-direction:column; min-width:0; }
.t-resp { grid-column:1 / -1; padding:2px 4px 0 8px; font-size:10.5px; color:var(--muted); font-weight:600; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tile svg { width:52px; height:52px; }
.t-num { font-family:'Space Grotesk', Inter, sans-serif; font-size:19px; color:var(--strong); line-height:1.15; white-space:nowrap; }
.t-num.q { font-size:12px; font-family:Inter, sans-serif; white-space:normal; line-height:1.2; }
.t-num.p { font-size:14.5px; letter-spacing:-.3px; }
.t-pe { position:absolute; right:7px; bottom:5px; display:flex; gap:3px; }
.t-pe span { width:5px; height:5px; border-radius:50%; background:var(--c); opacity:.75; }
.t-acv { position:absolute; right:6px; top:5px; font-size:10px; font-weight:700; color:var(--muted); background:var(--chip); border:1px solid var(--chip-b);
  padding:1px 6px; border-radius:999px; }
.tile.acervo { --c:#64748b; background:repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 13px); border:1px dashed var(--chip-b);
  justify-content:center; flex-direction:column; gap:2px; text-align:center; padding:6px; }
.tile.acervo { display:flex; flex-direction:column; justify-content:center; align-items:center; padding:8px; text-align:center; }
.tile.acervo b { font-size:12px; color:var(--text); }
.tile.acervo small { font-size:11px; color:var(--muted); }
.vazio { display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:18px; min-height:96px; }
.legenda { display:flex; flex-wrap:wrap; gap:8px 26px; align-items:center; margin-top:14px; font-size:12.5px; color:var(--muted); }
.legenda > span { display:inline-flex; align-items:center; gap:8px; }
.leg-hatch { width:26px; height:18px; border-radius:5px; border:1px dashed var(--chip-b); background:repeating-linear-gradient(135deg, var(--hatch) 0 4px, transparent 4px 8px); }

/* POPOVER junto do toque */
.pop { position:fixed; z-index:60; width:min(420px, calc(100vw - 24px)); background:var(--pop); border:1px solid var(--panel-b); border-radius:16px;
  box-shadow:var(--shadow); padding:16px 16px 14px; border-top:4px solid var(--c); animation:aparece .15s ease-out; }
@keyframes aparece { from { opacity:0; transform:translateY(6px) scale(.98); } to { opacity:1; transform:none; } }
.pop h3 { font-size:16px; padding-right:34px; }
.pop .sub { font-size:12px; color:var(--muted); margin:3px 0 10px; }
.pop .fechar { position:absolute; right:10px; top:8px; width:34px; height:34px; border-radius:10px; border:0; background:var(--chip); color:var(--muted); }
.pop-item { display:grid; grid-template-columns:64px 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--grid); align-items:center; }
.pop-item p { margin:0; font-size:13.5px; line-height:1.4; color:var(--text); }
.pop-item small { display:block; color:var(--muted); font-size:11.5px; margin-top:3px; }
.pop-num { font-family:'Space Grotesk', Inter, sans-serif; font-weight:700; font-size:20px; color:var(--c); text-align:center; line-height:1.1; }
.pop-num small { font-family:Inter, sans-serif; font-size:10px; color:var(--muted); font-weight:600; }
.pop-ir { margin-top:10px; width:100%; min-height:46px; border-radius:12px; border:0; background:var(--c); color:#0b1020; font-weight:800; font-size:14px; }
.pop-acv { font-size:12.5px; color:var(--muted); line-height:1.45; }
.pop-acv li { margin:3px 0; }

/* FATOR */
.hero { display:grid; grid-template-columns:1fr minmax(260px,380px); gap:22px; align-items:end; }
.hero-ic { width:52px; height:52px; border-radius:14px; display:grid; place-items:center; font-size:22px; color:var(--accent);
  background:rgba(14,165,233,.1); border:1px solid rgba(14,165,233,.3); margin-bottom:12px; }
.manejo { border-left:4px solid #22c55e; background:rgba(34,197,94,.08); border-radius:12px; padding:13px 16px; font-size:14px; line-height:1.45; }
.manejo b { display:block; color:#22c55e; font-size:11px; letter-spacing:.16em; text-transform:uppercase; margin-bottom:4px; }
.voltar { min-height:44px; padding:8px 14px; border-radius:12px; border:1px solid var(--chip-b); background:var(--chip); font-weight:700; font-size:13px; }
.integrado { margin-top:18px; }
.integrado .cab { display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:end; margin-bottom:8px; }
.integrado .cab p { margin:4px 0 0; color:var(--muted); font-size:13px; }
.linha-int { cursor:pointer; }
.linha-int:hover rect.fundo { fill:var(--chip); }
.cards { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; margin-top:18px; }
.card { background:var(--panel); border:1px solid var(--panel-b); border-radius:18px; padding:18px 20px 14px; scroll-margin-top:20px; transition:box-shadow .4s, border-color .4s; }
.card.realce { border-color:var(--c); box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 35%, transparent); }
.card-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--chip); border:1px solid var(--chip-b); color:var(--muted); }
.chip.g { color:var(--c); border-color:color-mix(in srgb, var(--c) 45%, transparent); background:color-mix(in srgb, var(--c) 12%, transparent); }
.chip.fora { color:#f59e0b; }
.card h3 { font-size:17px; }
.card .org { font-size:12.5px; color:var(--muted); margin:3px 0 6px; font-style:italic; }
.card .metrica { font-size:12px; color:var(--muted); margin:0 0 4px; }
.card svg.g { width:100%; height:auto; display:block; overflow:visible; }
.card .resultado { font-weight:700; color:var(--strong); font-size:14.5px; margin:8px 0 3px; }
.card .sentido { font-size:13.5px; line-height:1.5; margin:0 0 6px; }
.card .conta { font-size:12px; color:var(--muted); margin:6px 0; padding:8px 10px; border-radius:10px; background:var(--chip); }
details.fonte { border-top:1px solid var(--grid); margin-top:8px; padding-top:6px; }
details.fonte summary { cursor:pointer; min-height:40px; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--muted); list-style:none; }
details.fonte summary::-webkit-details-marker { display:none; }
details.fonte p { margin:5px 0; font-size:12.5px; line-height:1.45; }
.aconferir { color:#eab308; font-weight:700; }
.leg-serie { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:11.5px; color:var(--muted); margin:2px 0 4px; }
.leg-serie i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
.tema { position:fixed; right:14px; bottom:14px; z-index:50; min-height:44px; padding:8px 14px; border-radius:12px; background:var(--panel); border:1px solid var(--panel-b); font-size:12px; font-weight:700; }
@media (max-width:900px) { .cards { grid-template-columns:1fr; } .hero { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="pop-raiz"></div>
<script src="lib/d3.v7.min.js"></script>
<script src="js/fatores_dados.js"></script>
<script src="js/fatores.js"></script>
</body>
</html>
