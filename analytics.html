<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizoWiki · Fatores</title>
<link rel="stylesheet" href="css/all.min.css">
<style>
:root { --bg:#050816; --panel:rgba(15,23,42,.62); --panel-b:rgba(255,255,255,.08); --text:#cbd5e1; --muted:#94a3b8; --faint:#334155;
  --strong:#fff; --grid:rgba(255,255,255,.07); --chip:rgba(255,255,255,.05); --chip-b:rgba(255,255,255,.1); --hatch:rgba(148,163,184,.13);
  --pop:#0f172a; --shadow:0 20px 50px rgba(0,0,0,.55); --accent:#0ea5e9; }
html.light-mode { --bg:#f1f5f9; --panel:#ffffff; --panel-b:#e2e8f0; --text:#334155; --muted:#64748b; --faint:#cbd5e1; --strong:#0f172a;
  --grid:rgba(15,23,42,.08); --chip:#f8fafc; --chip-b:#e2e8f0; --hatch:rgba(100,116,139,.14); --pop:#ffffff; --shadow:0 18px 40px rgba(15,23,42,.18); }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; transition:background .3s,color .3s; overflow-x:hidden; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
.wrap { max-width:1500px; margin:0 auto; padding:22px clamp(12px,3vw,40px) 60px; }
.panel { background:var(--panel); border:1px solid var(--panel-b); border-radius:18px; padding:20px 22px; backdrop-filter:blur(12px); }
.display { font-family:'Space Grotesk', Inter, sans-serif; }
.eyebrow { font-size:11px; letter-spacing:.18em; text-transform:uppercase; font-weight:800; color:var(--accent); margin:0 0 6px; }
h1,h2,h3 { color:var(--strong); margin:0; font-family:'Space Grotesk', Inter, sans-serif; letter-spacing:-.02em; }
h1 { font-size:clamp(24px,3vw,36px); line-height:1.1; }
h2 { font-size:21px; }
h3 { font-size:16px; }
.lead { color:var(--muted); font-size:15px; line-height:1.55; margin:8px 0 0; max-width:900px; }
.selo { display:inline-flex; gap:8px; align-items:center; font-size:12px; font-weight:700; color:#22c55e; background:rgba(34,197,94,.1);
  border:1px solid rgba(34,197,94,.35); padding:5px 11px; border-radius:999px; }
html.embutido body { background:transparent; }
.chip.ok { color:#22c55e; } .chip.pend { color:#eab308; }
.previa { display:inline-flex; gap:8px; align-items:center; font-size:12px; font-weight:700; color:#eab308; background:rgba(234,179,8,.1);
  border:1px solid rgba(234,179,8,.35); padding:5px 11px; border-radius:999px; }

/* ORBES: mesmo padrão dos pontos da página da raiz (vidro escuro, borda e brilho na cor do item) */
.orbes { display:flex; align-items:flex-start; gap:4px; }
.orbe { --o:#38bdf8; position:relative; display:flex; flex-direction:column; align-items:center; gap:10px; min-width:96px; padding:8px 6px 6px;
  background:none; border:0; border-radius:16px; color:var(--text); -webkit-tap-highlight-color:transparent; }
.orbe-c { position:relative; width:54px; height:54px; border-radius:50%; display:grid; place-items:center; font-size:19px; color:var(--o);
  background:rgba(0,0,0,.42); border:2px solid color-mix(in srgb, var(--o) 75%, transparent); backdrop-filter:blur(12px);
  box-shadow:0 0 20px -6px var(--o), inset 0 0 14px color-mix(in srgb, var(--o) 16%, transparent); transition:all .4s cubic-bezier(.4,0,.2,1); }
.orbe-c i { filter:drop-shadow(0 0 6px color-mix(in srgb, var(--o) 60%, transparent)); }
.orbe-c::after { content:''; position:absolute; inset:-2px; border-radius:50%; border:2px solid var(--o); opacity:0; pointer-events:none; }
.orbe b { font-size:13px; font-weight:700; color:var(--strong); white-space:nowrap; letter-spacing:.01em; transition:color .3s; }
.orbe:hover .orbe-c, .orbe:focus-visible .orbe-c { transform:scale(1.1); background:rgba(0,0,0,.62); box-shadow:0 0 28px -2px var(--o); }
.orbe:hover .orbe-c::after { animation:pulso 1.3s ease-out infinite; }
@keyframes pulso { 0% { transform:scale(1); opacity:.55; } 100% { transform:scale(1.65); opacity:0; } }
.orbe.on .orbe-c { transform:scale(1.16); background:rgba(255,255,255,.1); box-shadow:0 0 32px var(--o), inset 0 0 16px color-mix(in srgb, var(--o) 30%, transparent); }
.orbe.on b { color:var(--o); }
.orbes.tem-on .orbe:not(.on):not(:hover) .orbe-c { border-color:rgba(255,255,255,.18); color:var(--muted); box-shadow:none; }
.orbes.tem-on .orbe:not(.on):not(:hover) .orbe-c i { filter:none; }
.orbes.tem-on .orbe:not(.on):not(:hover) b { color:var(--muted); }
html.light-mode .orbe-c { background:rgba(255,255,255,.75); box-shadow:0 4px 14px -6px var(--o); }
html.light-mode .orbe:hover .orbe-c, html.light-mode .orbe.on .orbe-c { background:#fff; box-shadow:0 0 22px -4px var(--o); }
html.light-mode .orbes.tem-on .orbe:not(.on):not(:hover) .orbe-c { border-color:#cbd5e1; }
html.light-mode .orbe b { color:var(--strong); }

/* navegação por fator */
.nav { overflow-x:auto; padding:10px 2px 8px; margin:16px 0 6px; scrollbar-width:thin; }
.nav-sep { flex:none; width:1px; align-self:stretch; margin:6px 6px; background:var(--panel-b); }
.abas-med { flex-wrap:wrap; margin:12px 0 4px; padding:6px 0; }
.hero-orbe { width:64px; height:64px; font-size:24px; margin-bottom:14px; }
.nota-painel { font-size:12.5px; color:var(--muted); margin:6px 2px 4px; }

/* MATRIZ */
.matriz-rolagem { overflow-x:auto; margin-top:14px; padding-bottom:6px; }
.matriz { display:grid; grid-template-columns:minmax(80px,168px) repeat(9, minmax(0,1fr)); gap:6px; }
.m-cab { display:flex; justify-content:center; align-items:flex-end; padding-bottom:6px; }
.m-cab .orbe { min-width:0; width:100%; padding:8px 0 6px; }
.orbe .r-curto { display:none; }
.leg-fatores { display:none; }

.m-org { display:flex; align-items:center; gap:10px; padding:0 8px; font-weight:700; color:var(--strong); font-size:14.5px; }
.m-org i { width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 10px var(--c); background:var(--c); }
.m-org small { display:block; font-weight:500; color:var(--muted); font-size:11px; }
.tile { position:relative; min-height:84px; border-radius:14px; display:grid; place-items:center; padding:4px;
  background:transparent; border:1px solid transparent; transition:transform .15s, background .2s, border-color .2s; }
.tile:hover, .tile.sel { background:color-mix(in srgb, var(--c) 9%, transparent); border-color:color-mix(in srgb, var(--c) 45%, transparent); }
.tile:hover svg, .tile.sel svg { transform:scale(1.08); }
.tile svg.esf { width:min(74px, 100%); height:auto; aspect-ratio:1; overflow:visible; transition:transform .15s; }
.vazio { min-height:84px; }
.legenda { display:flex; flex-wrap:wrap; gap:8px 26px; align-items:center; margin-top:14px; font-size:12.5px; color:var(--muted); }
.legenda > span { display:inline-flex; align-items:center; gap:4px; }
.legenda svg.esf { width:34px; height:34px; overflow:visible; }
.leg-vazio { display:inline-block; width:24px; height:24px; border-radius:8px; border:1px solid var(--chip-b); margin-right:4px; }
.nota-leg { font-size:12.5px; color:var(--muted); margin:10px 0 0; line-height:1.5; }
.nota-leg i { color:var(--accent); margin-right:4px; }

/* POPOVER junto do toque */
.pop { position:fixed; z-index:60; width:min(440px, calc(100vw - 24px)); max-height:calc(100vh - 16px); overflow:auto; background:var(--pop); border:1px solid var(--panel-b); border-radius:16px;
  box-shadow:var(--shadow); padding:16px 16px 14px; border-top:4px solid var(--c); animation:aparece .15s ease-out; }
@keyframes aparece { from { opacity:0; transform:translateY(6px) scale(.98); } to { opacity:1; transform:none; } }
.pop .fechar, .ficha .fechar { position:absolute; right:10px; top:8px; width:38px; height:38px; border-radius:10px; border:0; background:var(--chip); color:var(--muted); }
.pop-cab { display:flex; gap:12px; align-items:center; padding-right:40px; }
.pop-ic { width:40px; height:40px; flex:none; border-radius:12px; display:grid; place-items:center; color:var(--c); background:color-mix(in srgb, var(--c) 15%, transparent); border:1px solid color-mix(in srgb, var(--c) 40%, transparent); }
.pop h3 { font-size:16px; } .pop h3 span { color:var(--muted); font-weight:500; }
.pop .sub { font-size:12px; color:var(--muted); margin:3px 0 0; font-style:italic; }
.pop-cont { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; }
.pop-cont span { font-size:12px; color:var(--muted); background:var(--chip); border:1px solid var(--chip-b); border-radius:999px; padding:3px 10px; }
.pop-cont b { color:var(--strong); font-family:'Space Grotesk', Inter, sans-serif; }
.pend { color:#eab308 !important; } .pend b { color:#eab308 !important; } .ok { color:#22c55e; }
.pop-meio { display:grid; grid-template-columns:150px 1fr; gap:12px; align-items:center; margin-top:6px; }
.anel { width:150px; height:150px; display:block; }
.fatia { cursor:pointer; transition:opacity .15s; }
.pop-leg { display:flex; flex-direction:column; gap:4px; }
.leg-cat { display:grid; grid-template-columns:12px 1fr auto; gap:8px; align-items:center; text-align:left; min-height:40px; padding:6px 10px; border-radius:10px; border:1px solid transparent; background:none; font-size:13px; color:var(--text); }
.leg-cat i { width:12px; height:12px; border-radius:50%; }
.leg-cat b { color:var(--strong); font-family:'Space Grotesk', Inter, sans-serif; font-size:15px; }
.leg-cat:hover, .leg-cat.on { background:var(--chip); border-color:var(--chip-b); }
.pop-cat { margin:8px 0 0; padding:10px; border-radius:12px; background:var(--chip); }
.pop-cat > b { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
.ref-ex { display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; min-height:44px; text-align:left; padding:8px 4px; border:0; border-top:1px solid var(--grid); background:none; font-size:13px; line-height:1.4; color:var(--text); }
.ref-ex small { display:block; color:var(--muted); font-size:11.5px; margin-top:2px; }
.ref-ex i { color:var(--muted); flex:none; }
.pop-sint { font-size:13.5px; line-height:1.5; color:var(--strong); margin:12px 0 4px; }
.pop-obs { font-size:11.5px; line-height:1.45; color:var(--muted); margin:4px 0 0; }
.pop-bts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.pop-bts button { min-height:46px; border-radius:12px; font-weight:800; font-size:13.5px; border:1px solid var(--c); background:none; color:var(--strong); }
.pop-bts .pop-ir { background:var(--c); color:#0b1020; }
.pop-bts .pop-volta { grid-column:1 / -1; }
.pop-lista { margin-top:8px; }
.pop-lista .ref { padding:10px 0; border-top:1px solid var(--grid); }
.pop-lista .ref > p { margin:0; font-size:13px; line-height:1.45; color:var(--strong); }
.pop-lista .ref > small { display:block; font-size:11.5px; color:var(--muted); margin:3px 0 4px; }
.pop-lista .ref a { font-size:12px; color:var(--accent); word-break:break-all; }

/* NÍVEL 2: dica junto do toque */
.dica { position:absolute; z-index:80; max-width:min(320px, calc(100vw - 16px)); background:var(--pop); border:1px solid var(--panel-b); border-radius:12px;
  box-shadow:var(--shadow); padding:10px 40px 10px 12px; font-size:12.5px; line-height:1.45; color:var(--text); animation:aparece .12s ease-out; }
.dica[hidden] { display:none; }
.dica b { color:var(--strong); font-size:14px; } .dica small { color:var(--muted); }
.dica-x { position:absolute; right:6px; top:6px; width:30px; height:30px; border-radius:8px; border:0; background:var(--chip); color:var(--muted); }
[data-tip] { cursor:pointer; }
.dica-on { stroke:var(--strong); stroke-width:2.5; }
.nota-curva { font-size:11px; color:var(--muted); margin:2px 0 0; font-style:italic; }

/* NÍVEL 3: ficha do estudo */
.ficha-fundo { position:absolute; left:0; top:0; width:100%; z-index:90; background:rgba(2,6,23,.55); backdrop-filter:blur(2px); }
html.light-mode .ficha-fundo { background:rgba(15,23,42,.25); }
.ficha { position:absolute; left:50%; transform:translateX(-50%); width:min(720px, calc(100vw - 24px)); background:var(--pop); border:1px solid var(--panel-b);
  border-top:4px solid var(--c); border-radius:18px; box-shadow:var(--shadow); padding:20px 22px; }
.ficha h3 { font-size:19px; padding-right:44px; }
.ficha .org { font-size:13px; color:var(--muted); font-style:italic; margin:4px 0 10px; }
.ficha .resultado { font-weight:700; color:var(--strong); font-size:15px; margin:0 0 6px; }
.ficha .sentido { font-size:14px; line-height:1.55; margin:0 0 10px; }
.fx-l { display:grid; grid-template-columns:170px 1fr; gap:12px; padding:9px 0; border-top:1px solid var(--grid); font-size:13px; line-height:1.5; }
.fx-l b { color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; padding-top:2px; }
.fx-l a { color:var(--accent); word-break:break-all; }

/* FATOR */
.hero { display:grid; grid-template-columns:1fr minmax(260px,380px); gap:22px; align-items:end; }
.hero-ic { width:52px; height:52px; border-radius:14px; display:grid; place-items:center; font-size:22px; color:var(--accent);
  background:rgba(14,165,233,.1); border:1px solid rgba(14,165,233,.3); margin-bottom:12px; }
.manejo { border-left:4px solid #22c55e; background:rgba(34,197,94,.08); border-radius:12px; padding:13px 16px; font-size:14px; line-height:1.45; }
.manejo b { display:block; color:#22c55e; font-size:11px; letter-spacing:.16em; text-transform:uppercase; margin-bottom:4px; }
.voltar { min-height:44px; padding:8px 14px; border-radius:12px; border:1px solid var(--chip-b); background:var(--chip); font-weight:700; font-size:13px; }
.integrado { margin-top:18px; }
.integrado .cab { display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:end; margin-bottom:8px; }
.integrado .cab p { margin:4px 0 0; color:var(--muted); font-size:13px; }
.linha-int { cursor:pointer; }
.linha-int:hover rect.fundo { fill:var(--chip); }
.cards { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; margin-top:12px; }
.paineis { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap:14px; }
.painel-med { border:1px solid var(--panel-b); border-radius:14px; padding:12px 14px 6px; background:var(--chip); }
.painel-med h3 { font-size:14px; margin-bottom:4px; }
.painel-med svg.g { width:100%; height:auto; display:block; overflow:visible; }
.secao-med { margin-top:26px; }
.med-tit { display:flex; align-items:baseline; gap:10px; font-size:19px; padding:0 4px; }
.med-tit small { font-family:Inter, sans-serif; font-size:12.5px; color:var(--muted); font-weight:600; letter-spacing:0; }
.card { background:var(--panel); border:1px solid var(--panel-b); border-radius:18px; padding:18px 20px 14px; scroll-margin-top:20px; transition:box-shadow .4s, border-color .4s; }
.card.realce { border-color:var(--c); box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 35%, transparent); }
.card-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--chip); border:1px solid var(--chip-b); color:var(--muted); }
.chip.g { color:var(--c); border-color:color-mix(in srgb, var(--c) 45%, transparent); background:color-mix(in srgb, var(--c) 12%, transparent); }
.chip.fora { color:#f59e0b; }
.card h3 { font-size:17px; }
.card .org { font-size:12.5px; color:var(--muted); margin:3px 0 6px; font-style:italic; }
.card .metrica { font-size:12px; color:var(--muted); margin:0 0 4px; }
.card svg.g { width:100%; height:auto; display:block; overflow:visible; }
.card .resultado { font-weight:700; color:var(--strong); font-size:14.5px; margin:8px 0 3px; }
.card .sentido { font-size:13.5px; line-height:1.5; margin:0 0 6px; }
.card-pe { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; border-top:1px solid var(--grid); margin-top:10px; padding-top:8px; font-size:12px; color:var(--muted); }
.ver-estudo { min-height:42px; padding:6px 14px; border-radius:10px; border:1px solid color-mix(in srgb, var(--c) 50%, transparent); background:color-mix(in srgb, var(--c) 10%, transparent); font-weight:700; font-size:13px; color:var(--strong); }
.card .conta { font-size:12px; color:var(--muted); margin:6px 0; padding:8px 10px; border-radius:10px; background:var(--chip); }
details.fonte { border-top:1px solid var(--grid); margin-top:8px; padding-top:6px; }
details.fonte summary { cursor:pointer; min-height:40px; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--muted); list-style:none; }
details.fonte summary::-webkit-details-marker { display:none; }
details.fonte p { margin:5px 0; font-size:12.5px; line-height:1.45; }
.aconferir { color:#eab308; font-weight:700; }
.leg-serie { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:11.5px; color:var(--muted); margin:2px 0 4px; }
.leg-serie i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
.tema { position:fixed; right:14px; bottom:14px; z-index:50; min-height:44px; padding:8px 14px; border-radius:12px; background:var(--panel); border:1px solid var(--panel-b); font-size:12px; font-weight:700; }
@media (max-width:900px) { .cards { grid-template-columns:1fr; } .hero { grid-template-columns:1fr; } }
@media (max-width:520px) { .pop-meio { grid-template-columns:1fr; justify-items:center; } .fx-l { grid-template-columns:1fr; gap:2px; } .ficha { padding:16px; } }
/* tablet: nome curto */
@media (max-width:1180px) {
  .m-cab .r-cheio { display:none; } .m-cab .r-curto { display:block; font-size:12px; }
  .m-cab .orbe-c { width:46px; height:46px; font-size:17px; }
  .tile { min-height:70px; } .vazio { min-height:70px; }
}
/* celular: só o ícone no cabeçalho e uma legenda logo abaixo */
@media (max-width:640px) {
  .wrap { padding:14px 8px 40px; } .panel { padding:16px 12px; border-radius:14px; }
  .matriz { gap:2px; grid-template-columns:78px repeat(9, minmax(0,1fr)); }
  .m-cab .r-curto { display:none; }
  .m-cab .orbe { gap:0; padding:4px 0; } .m-cab .orbe-c { width:min(30px, 100%); height:auto; aspect-ratio:1; font-size:12px; border-width:1.5px; }
  .m-org { padding:0 2px; gap:5px; font-size:11.5px; line-height:1.15; hyphens:manual; } .m-org i { width:8px; height:8px; } .m-org small { display:none; }
  .tile { min-height:46px; padding:1px; border-radius:8px; } .vazio { min-height:46px; }
  .matriz-rolagem { overflow:visible; } .tile svg.esf { transform:scale(1.3); } .tile:hover svg, .tile.sel svg { transform:scale(1.4); }
  .leg-fatores { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .leg-fatores button { display:inline-flex; align-items:center; gap:6px; min-height:34px; padding:4px 10px 4px 6px; border-radius:999px; font-size:12px; font-weight:700;
    color:var(--strong); background:rgba(0,0,0,.3); border:1px solid color-mix(in srgb, var(--o) 55%, transparent); }
  .leg-fatores button i { color:var(--o); width:20px; text-align:center; }
  h1 { font-size:24px; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="pop-raiz"></div>
<script src="js/fatores_dados.js"></script>
<script src="js/fatores.js"></script>
</body>
</html>
